syntax = "proto3";
package Protocol;

import "Enum.proto";

message Possession
{
    int64 gold = 1;
    repeated ContainerSlots containers = 2;    // 인벤토리의 구역 셋과 착용 장비. 빈 칸도 싣는다
}

message GearInfo
{
    int32 enhance_level = 1;
    int32 durability = 2;
}

message Item
{
    int32 template_id = 1;
    optional int64 item_uid = 2;
    optional int32 count = 3;

    // 아이템 인스턴스 데이터
    oneof instance_data{
        GearInfo gearInfo = 4;
    }
}

// 칸 하나를 가리키는 주소
message SlotAddress
{
    ContainerType container = 1;
    int32 slot_index = 2;               // 컨테이너 안의 칸 번호. 착용 장비에서는 장비 부위(GearType) 값이다
}

// 이 주소의 칸은 이제 이 내용이다. item이 없으면 아이템이 없는 칸이다
message SlotChange
{
    SlotAddress address = 1;
    optional Item item = 2;
}

// 컨테이너 안의 칸 하나. item이 없으면 아이템이 없는 칸이다
message Slot
{
    int32 slot_index = 1;
    optional Item item = 2;
}

// 컨테이너 하나의 모든 칸
message ContainerSlots
{
    ContainerType container = 1;
    repeated Slot slots = 2;
}

// 퀵슬롯이 가리키는 대상. 아이템 하나가 아니라 아이템 정의를 가리킨다
message QuickSlotRef
{
    QuickSlotRefType ref_type = 1;
    int32 ref_id = 2;
}

// 퀵슬롯 하나. ref가 없으면 빈 퀵슬롯이다
message QuickSlot
{
    int32 slot_index = 1;               // 0부터 퀵슬롯 개수 미만
    optional QuickSlotRef ref = 2;
}

