syntax = "proto3";
package Protocol;

enum CharacterClass
{
	CLASS_TYPE_NONE = 0;
	CLASS_TYPE_WARRIOR = 1;
	CLASS_TYPE_MAGE = 2;
}

enum ItemType
{
    ITEM_TYPE_NONE = 0;            
    ITEM_TYPE_GEAR = 1;            // 장비탭
    ITEM_TYPE_CONSUMABLE = 2;      // 소비탭
    ITEM_TYPE_MISCELLANEOUS = 3;   // 기타탭
}

// 아이템을 담는 컨테이너의 종류. 인벤토리의 구역 셋과 착용 장비다.
enum ContainerType
{
    CONTAINER_TYPE_NONE = 0;
    CONTAINER_TYPE_INVENTORY_GEAR = 1;          // 장비 구역
    CONTAINER_TYPE_INVENTORY_CONSUMABLE = 2;    // 소모품 구역
    CONTAINER_TYPE_INVENTORY_MISC = 3;          // 기타 구역
    CONTAINER_TYPE_EQUIPPED = 4;                // 착용 장비. 칸 번호가 장비 부위(GearType) 값이다
}

enum GearType
{
    GEAR_TYPE_NONE = 0;
    GEAR_TYPE_HELMET = 1;
    GEAR_TYPE_CHEST = 2;
    GEAR_TYPE_LEGS = 3;
    GEAR_TYPE_ARMS = 4;
    GEAR_TYPE_BOOTS = 5;
    GEAR_TYPE_WEAPON = 6;
}

// 퀵슬롯이 가리키는 대상의 종류. DB의 QuickSlot.RefType과 같은 값이다
enum QuickSlotRefType
{
    QUICK_SLOT_REF_TYPE_NONE = 0;
    QUICK_SLOT_REF_TYPE_ITEM = 1;       // 아이템 정의. ref_id가 아이템 번호다
}