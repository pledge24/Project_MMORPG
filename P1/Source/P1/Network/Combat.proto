syntax = "proto3";
package Protocol;

// 공격, 피격, 사망, 보상
// @packet_id_range 500 599

import "Common.proto";

enum CombatResult
{
    COMBAT_RESULT_SUCCESS = 0;
    COMBAT_RESULT_DEAD = 1;                 // 사망한 플레이어는 공격할 수 없다
    COMBAT_RESULT_INVALID_ACTION = 2;       // 직업의 콤보 첫 단계도, 직전 액션의 다음 단계도 아니다
    COMBAT_RESULT_TOO_EARLY = 3;            // 직전 액션이 끝나지 않았고 그 콤보 입력 창도 아직 열리지 않았다
    COMBAT_RESULT_INVALID_POSITION = 4;     // 시작 위치가 이동 판정을 통과하지 못했다
    COMBAT_RESULT_INVALID_YAW = 5;          // 시작 방향이 -180도에서 180도 사이의 수가 아니다
}

// 내 플레이어가 액션을 시작했다. 클라이언트는 몽타주를 먼저 재생하고 보낸다
message C_ACTION
{
    int32 action_id = 1;
    float yaw = 2;                          // 시작 방향(도)
    Vector start_pos = 3;                   // 시작 위치(캡슐 중심)
}

// 액션 요청의 결과. 요청한 플레이어에게만 간다. 거절이면 클라이언트는 몽타주를 멈추고 콤보를 첫 단계로 돌린다
message S_ACTION
{
    CombatResult result = 1;
}

// 크리처가 액션을 시작했다. 그 크리처를 보는 플레이어에게 가고, 시작한 크리처가 플레이어면 그 플레이어는 받지 않는다
message S_ACTION_START
{
    int64 entity_id = 1;
    int32 action_id = 2;
    float yaw = 3;                          // 시작 방향(도). 액션이 끝날 때까지 바뀌지 않는다
}

// 크리처가 피격됐다
message S_HIT
{
    int64 entity_id = 1;
    int64 damage = 2;
    int64 hp = 3;                           // 피격 뒤 남은 체력
}

message S_DIE
{
    int64 entity_id = 1;
}

message LevelUp
{
    int32 level = 1;                        // 오른 뒤의 레벨
    repeated Stat changed_stats = 2;
}

// 처치 보상을 받았다. 받은 플레이어에게만 간다
message S_REWARD
{
    int64 exp = 1;                          // 보상을 더한 뒤 지금 레벨 안의 경험치
    int64 gold = 2;                         // 보상을 더한 뒤의 골드
    LevelUp level_up = 3;                   // 레벨이 오르지 않았으면 없다
}
