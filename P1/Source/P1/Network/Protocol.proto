syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_PING
{

}

message S_PONG
{

}

message C_LOGIN
{
    string access_token = 1;
}

message S_LOGIN
{
	bool success = 1;
	repeated CharacterOverview characters = 2; // 캐릭터 아이디 발급 전
}

message C_CREATE_CHARACTER
{
    CharacterOverview character = 1;
}

message S_CREATE_CHARACTER
{
    bool success = 1;
    string cause = 2;
    uint64 character_id = 3;
}

message C_DELETE_CHARACTER
{
    uint64 character_id = 1;
}

message S_DELETE_CHARACTER
{
    bool success = 1;
    uint64 character_id = 2;
}

message C_ENTER_GAME
{
	uint64 character_id = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
}

message C_ENTER_MAP_COMPLETE
{

}

message C_MOVE_ROOM
{
    uint32 portal_id = 1;
}

message S_MOVE_ROOM
{
    uint32 map_id = 1;
    PosInfo info = 2;
    repeated ObjectInfo objects = 3;
}

message C_LEAVE_GAME
{

}

message S_LEAVE_GAME
{

}

message S_SPAWN
{
	repeated ObjectInfo objects = 1;
}

message S_DESPAWN
{
	repeated uint64 object_ids = 1;
}

message C_MOVE
{
	PosInfo info = 1;
}

message S_MOVE
{
	repeated PosInfo info = 1;
}

message C_NORMAL_ATTACK
{
    uint32 combo = 1;
}

message S_NORMAL_ATTACK
{
    uint64 object_id = 1;
    uint32 combo = 2;
    float yaw = 3;
}

message S_HIT
{
    uint64 attacker_id = 1;         // object_id
    uint64 target_id = 2;           // object_id

    DamageType damage_type = 3;     // 물리 피해? 마법 피해?

    // 맞아서 바뀐 스텟들
    oneof hit_result
    {
        uint32 hp = 4;
        repeated Stat updated_stat = 5;
    }
}

message C_BUY_ITEM
{
    int32 template_id = 1;
    int32 count = 2;        // 현재 1로 고정(그래서 사용안함)
}

message S_BUY_ITEM
{
    bool success = 1;
    Slot updated_slot = 2;
    int64 gold = 3;
}

message C_SELL_ITEM
{ 
    Slot slot = 1;
    int32 count = 2;        // 현재 1로 고정(그래서 사용안함)
}

message S_SELL_ITEM
{
    bool success = 1;
    Slot updated_slot = 2;
    int64 gold = 3;
}

message C_EQUIP_GEAR
{
    Slot slot = 1;
}

message S_EQUIP_GEAR
{
    bool success = 1;
    uint64 object_id = 2;
    Slot updated_equipped_slot = 3;
    
    optional Slot updated_inventory_slot = 4;
    optional StatInfo updated_stat_info = 5; // 바뀐 스탯
}

message C_UNEQUIP_GEAR
{
    Slot slot = 1;
}

message S_UNEQUIP_GEAR
{
    bool success = 1;
    uint64 object_id = 2;
    Slot updated_equipped_slot = 3;
    
    optional Slot updated_inventory_slot = 4;
    optional StatInfo updated_stat_info = 5; // 바뀐 스탯
}

message C_USE_ITEM
{
    Slot slot = 1;
}

message S_USE_ITEM
{
    bool success = 1;
    uint64 object_id = 2;

    optional Slot updated_inventory_slot = 3;
    optional StatInfo updated_stat_info = 4; // 바뀐 스탯
}