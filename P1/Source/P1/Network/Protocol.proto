syntax = "proto3";
package Protocol;

// 옛 파일. 지금의 패킷 번호를 그대로 두는 임시 범위다
// @packet_id_range 1000 1999

import "Enum.proto";
import "Struct.proto";

message C_PING
{

}

message S_PONG
{

}

message C_ENTER_GAME
{
	int64 character_id = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
	EntityInfo player = 2;  

    // 캐릭터 개인 정보
    StatInfo stat_info = 3;         // 스텟 정보
    Possession possession = 4;      // 소유물
    repeated QuickSlot quick_slots = 5; // 모든 퀵슬롯. 빈 퀵슬롯도 싣는다
}

message C_LEAVE_GAME
{

}

message C_MAP_LOAD_COMPLETE
{

}

message C_ENTER_MAP
{
    // 이 패킷은 게임 입장 후에 사용한다.
    int32 map_id = 1;
    optional PosInfo info = 2;      // 서버 검증용

    oneof enter_data
    {
        int32 portal_id = 3;       // 사용한 포탈 id
        int32 room_id = 4;
    }
}

message S_ENTER_MAP
{
    bool success = 1;
    int32 map_id = 2;
    int32 room_id = 3;
}

message C_ENTER_ROOM
{
    EnterType enter_type = 1;

    // Room 입장에 필요한 추가 데이터
    oneof enter_data
    {
        int32 room_id = 2;
        int32 portal_id = 3;
    }
}

message S_ENTER_ROOM
{
    bool success = 1;
    EnterType enter_type = 2;   // 요청 확인용
    int32 room_id = 3;

    // 게임에 참여하지 않고 단순 입장만 하는 경우 고려해서 optional 추가
    optional PosInfo enter_pos = 4; 
}

message S_SPAWN
{
	repeated EntityInfo entities = 1;
}

message S_DESPAWN
{
	repeated int64 entity_ids = 1;
}

message C_MOVE
{
	PosInfo info = 1;
}

message S_MOVE
{
	repeated PosInfo info = 1;
}

message C_NORMAL_ATTACK
{
    int32 combo = 1;
    float yaw = 2;
}

message S_NORMAL_ATTACK
{
    int64 entity_id = 1;
    int32 combo = 2;
    float yaw = 3;
}

message S_HIT
{
    int64 entity_id = 1;
    int64 damage = 2;
    optional int64 updated_hp = 3; 
}

message C_BUY_ITEM
{
    int32 template_id = 1;
    int32 count = 2;        // 현재 1로 고정(그래서 사용안함)
}

message S_BUY_ITEM
{
    bool success = 1;
    repeated SlotChange changed_slots = 2;
    int64 gold = 3;
}

// 아이템 요청은 칸 주소와 클라이언트가 그 칸에서 본 아이템의 uid로 칸을 가리킨다.
// 서버는 그 칸의 아이템 uid가 다르면 거절한다.
message C_SELL_ITEM
{ 
    SlotAddress address = 1;
    int64 item_uid = 2;
    int32 count = 3;        // 현재 1로 고정(그래서 사용안함)
}

message S_SELL_ITEM
{
    bool success = 1;
    repeated SlotChange changed_slots = 2;
    int64 gold = 3;
}

message C_EQUIP_GEAR
{
    SlotAddress address = 1;
    int64 item_uid = 2;
}

message S_EQUIP_GEAR
{
    bool success = 1;
    int64 entity_id = 2;
    
    // 장착 결과의 외형: 장착된 장비 부위(GearType)와 그 부위의 아이템
    int32 gear_type = 3; 
    int32 template_id = 4;

    // 장착 결과(나에게만)
    repeated SlotChange changed_slots = 5;
    repeated Stat updated_stat = 6;     // 바뀐 스탯
}

message C_UNEQUIP_GEAR
{
    SlotAddress address = 1;
    int64 item_uid = 2;
}

message S_UNEQUIP_GEAR
{
    bool success = 1;
    int64 entity_id = 2;

    // 탈착 결과의 외형: 비워진 장비 부위(GearType)와 그 부위의 아이템(항상 0)
    int32 gear_type = 3; 
    int32 template_id = 4;

    // 탈착 결과(나에게만)
    repeated SlotChange changed_slots = 5;
    repeated Stat updated_stat = 6;     
}

message C_USE_ITEM
{
    SlotAddress address = 1;
    int64 item_uid = 2;
}

message S_USE_ITEM
{
    bool success = 1;
    int64 entity_id = 2;

    // 사용 결과
    repeated SlotChange changed_slots = 3;
    repeated Stat updated_stat = 4;     // 바뀐 스탯
}

// 퀵슬롯 하나에 대상을 등록한다. ref가 없으면 해제한다. 다른 퀵슬롯에 있는 대상이면 두 퀵슬롯이 바뀐다
message C_SET_QUICK_SLOT
{
    int32 slot_index = 1;
    optional QuickSlotRef ref = 2;
}

message S_SET_QUICK_SLOT
{
    bool success = 1;
    repeated QuickSlot changed_quick_slots = 2;
}

// 퀵슬롯에 등록한 소모품을 쓴다. 쓸 칸은 서버가 고른다. 응답은 S_USE_ITEM이다
message C_USE_QUICK_SLOT
{
    int32 slot_index = 1;
}

message S_DIE
{
    int64 entity_id = 1;
}

message S_REWARD_RESULT
{
    RewardType type = 1;
    Reward reward = 2;

    // 갱신된 데이터
    int64 updated_exp = 3;
    int64 updated_gold = 4;
    bool is_level_up = 5;
    LevelUpInfo level_up_details = 6;
}

message C_RESPAWN
{
    RespawnType respawn_type = 1;

    // 리스폰 타입에 따라 사용
    oneof respawn_data
    {
        int64 item_uid = 2;           
        int32 checkpoint_id = 3;     
        int64 target_player_id = 4;  
        int32 town_id = 5;           
    }
}

message S_RESPAWN
{
    // S_RESPAWN은 리스폰 요청의 결과만 알려주고 실제 스폰은 하지 않는다.
    bool success = 1;
    string error_message = 2;
    RespawnType respawn_type = 3;
    int64 entity_id = 4;

    // 리스폰시 변경된 데이터
    int32 room_id = 5;
    PosInfo pos_info = 6;
    repeated Stat updated_stat = 7;
}

message C_CHAT
{
    string msg = 1;
}

message S_CHAT
{
    int64 entity_id = 1;
    string msg = 2;
}
