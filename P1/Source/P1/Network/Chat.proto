syntax = "proto3";
package Protocol;

// 채팅
// @packet_id_range 700 799

enum ChatResult
{
    CHAT_RESULT_SUCCESS = 0;
    CHAT_RESULT_INVALID_MESSAGE = 1;        // 비었거나 길이 제한을 넘는다
}

message C_CHAT
{
    string message = 1;
}

message S_CHAT
{
    ChatResult result = 1;
}

// 게임 서버의 플레이어가 말했다. 말한 플레이어를 포함해 그 게임 서버의 모든 룸에 있는 플레이어에게 간다
message S_CHAT_MESSAGE
{
    int64 entity_id = 1;
    string message = 2;
    string name = 3;                        // 말한 플레이어의 이름. 다른 룸의 플레이어는 받는 쪽이 엔티티로 모른다
}
