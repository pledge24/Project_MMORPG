syntax = "proto3";
package Protocol;

// 채팅
// @packet_id_range 700 799

enum ChatResult
{
    CHAT_RESULT_SUCCESS = 0;
    CHAT_RESULT_INVALID_MESSAGE = 1;        // 비었거나 길이 제한을 넘는다
}

message C_CHAT
{
    string message = 1;
}

message S_CHAT
{
    ChatResult result = 1;
}

// 룸의 플레이어가 말했다. 말한 플레이어를 포함한 룸의 모든 플레이어에게 간다
message S_CHAT_MESSAGE
{
    int64 entity_id = 1;
    string message = 2;
    string name = 3;                        // 말한 플레이어의 이름. 받는 쪽에서 그 엔티티가 이미 사라졌어도 보여 줄 수 있다
}
