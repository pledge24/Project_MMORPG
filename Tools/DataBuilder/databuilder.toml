# DataBuilder 설정. 어느 워크북을 읽고, 어느 서버 모듈이 그 표를 읽는지 정한다.
# 경로는 저장소 루트 기준이다. 규칙은 docs/codegen.md 「DataBuilder」에 있다.

source_dir = "DesignData"
proto_dir = "Protocol/Schema"

# 서버 모듈마다 산출물 폴더가 하나다. DataBuilder가 실행마다 비우고 다시 쓴다.
# 모듈마다 생성되는 C++ 네임스페이스가 다르다. 기동할 때의 대조가 두 모듈의 헤더를 함께 include한다.
[modules.game]
server_dir = "Server/GameServer/Game/Data/Generated"
namespace = "DesignData"

# 로비와 게임은 서로의 기획 데이터를 읽지 않는다.
[modules.lobby]
server_dir = "Server/GameServer/Lobby/Data/Generated"
namespace = "LobbyDesignData"

# 클라이언트 산출물. 키 말고 클라이언트로 가는 열이 하나라도 있는 표만 만든다.
# JSON은 Content/ 밖에 두고, 에디터 메뉴가 그 JSON으로 데이터 테이블을 채운다. 두 폴더 모두 실행마다 비우고 다시 쓴다.
[client]
json_dir = "P1/DesignData/Generated"
source_dir = "P1/Source/P1/Game/Data/Generated"

# 표. 워크북 하나가 표 하나다.
[tables.Currency]
workbook = "Currency.xlsx"
modules = ["game"]

# 아이템의 공통 열. 종류별 열은 아래 두 표에 있고, 그 종류의 아이템만 참조한다.
[tables.Item]
workbook = "Item.xlsx"
modules = ["game"]

[tables.ItemEquipStat]
workbook = "ItemEquipStat.xlsx"
modules = ["game"]

[tables.ItemConsumeEffect]
workbook = "ItemConsumeEffect.xlsx"
modules = ["game"]

# 레벨마다 필요한 경험치는 직업과 무관하고, 레벨마다의 능력치는 직업마다 다르다.
[tables.Level]
workbook = "Level.xlsx"
modules = ["game"]

[tables.ClassLevelStat]
workbook = "ClassLevelStat.xlsx"
modules = ["game"]

# 몬스터의 능력치와 기본 보상. 드롭은 아래 드롭 그룹 표를 참조한다.
[tables.Monster]
workbook = "Monster.xlsx"
modules = ["game"]

[tables.DropGroup]
workbook = "DropGroup.xlsx"
modules = ["game"]

# 드롭 항목은 DropGroup.json의 각 그룹 아래 Entries에 싣는다.
[tables.DropEntry]
workbook = "DropEntry.xlsx"
modules = ["game"]
nest = "Entries"

# 맵은 클라이언트가 로드하는 레벨이고, 지역은 맵 안의 공간이다. 서버는 지역마다 룸을 만든다.
[tables.Map]
workbook = "Map.xlsx"
modules = ["game"]

[tables.Area]
workbook = "Area.xlsx"
modules = ["game"]

# 포털은 Area.json의 각 지역 아래 Portals에 싣는다.
[tables.Portal]
workbook = "Portal.xlsx"
modules = ["game"]
nest = "Portals"

# 값이 하나뿐인 설정. 설정 워크북의 시트 하나가 구조체 하나다.
# 새 캐릭터가 첫 게임 입장에서 갖는 진행. 시작 맵은 맵 표를 참조한다.
[settings.Progress]
workbook = "Config.xlsx"
sheet = "Progress"
modules = ["game"]

# 로비만 읽는 기본 슬롯 수와 생성할 수 있는 직업.
[settings.Lobby]
workbook = "Config.xlsx"
sheet = "Lobby"
modules = ["lobby"]

# .proto에 없는 기획 데이터 전용 열거형. 값 번호는 DB나 패킷에 실릴 수 있으므로 바꾸지 않는다.
[enums.CurrencyType]
GOLD = 1

[enums.MonsterAttackType]
MELEE = 1
RANGED = 2

# 드롭 그룹의 판정 방식. INDEPENDENT는 항목마다 따로, WEIGHTED는 가중치로 정해진 개수를 뽑는다.
[enums.DropMethod]
INDEPENDENT = 1
WEIGHTED = 2

# 지역 유형. 서버는 읽지 않는다.
[enums.AreaType]
SAFE_ZONE = 1
HUNTING_FIELD = 2

# 포털 유형. 지금은 같은 맵이든 다른 맵이든 지역 사이를 잇는 AREA 하나다.
[enums.PortalType]
AREA = 1
