syntax = "proto3";
package Protocol;

enum ObjectType
{
	OBJECT_TYPE_NONE = 0;
	OBJECT_TYPE_PLAYER = 1;
	OBJECT_TYPE_MONSTER = 2;
	OBJECT_TYPE_PROJECTILE = 3;
	OBJECT_TYPE_ENV = 4;
}

enum CharacterClass
{
	CLASS_TYPE_NONE = 0;
	CLASS_TYPE_WARRIOR = 1;
	CLASS_TYPE_MAGE = 2;
}

enum MoveState
{
	MOVE_STATE_NONE = 0;
	MOVE_STATE_IDLE = 1;
	MOVE_STATE_RUN = 2;
    MOVE_STATE_ACTION = 3; // Root Motion이 들어간 애니메이션 실행
}

enum HitType
{
    HIT_TYPE_NONE = 0;
    HIT_TYPE_NORMAL = 1;
    HIT_TYPE_SKILL = 2;
    HIT_TYPE_EOT = 3;           // Effect Over Time: 지속 효과 피해
}

enum DamageType
{
    DAMAGE_TYPE_NONE = 0;
    DAMAGE_TYPE_PHYSICAL = 1;   // 물리 피해
    DAMAGE_TYPE_MAGICAL = 2;    // 마법 피해
    DAMAGE_TYPE_FIX = 3;        // 고정 피해
}

enum EffectType
{
    EFFECT_TYPE_NONE = 0;
    EFFECT_TYPE_BLEEDING = 1;   // 출혈
    EFFECT_TYPE_BURN = 2;       // 화상
    EFFECT_TYPE_POSION = 3;     // 독
    EFFECT_TYPE_SPEED_UP = 4;   // 이속 증가
    EFFECT_TYPE_SPEED_DOWN = 5; // 이속 감소
}

enum ItemType
{
    ITEM_TYPE_NONE = 0;            
    ITEM_TYPE_GEAR = 1;            // 장비탭
    ITEM_TYPE_CONSUMABLE = 2;      // 소비탭
    ITEM_TYPE_MISCELLANEOUS = 3;   // 기타탭
}

enum SlotType
{
    SLOT_TYPE_NONE = 0;
    SLOT_TYPE_INVENTORY_GEAR = 1;               // 인벤 장비 슬롯
    SLOT_TYPE_INVENTORY_CONSUMABLE = 2;         // 인벤 소비 슬롯
    SLOT_TYPE_INVENTORY_MISC = 3;               // 인벤 기타 슬롯
    SLOT_TYPE_EQUIPPED = 4;                     // 장비 슬롯
    SLOT_TYPE_QUICK = 5;                        // 퀵 슬롯
}

enum StatType
{
    STAT_TYPE_NONE = 0;
    STAT_TYPE_MAX_HP = 1;
    STAT_TYPE_HP = 2;
    STAT_TYPE_MAX_MP = 3;
    STAT_TYPE_MP = 4;
    STAT_TYPE_PHYSICAL_ATTACK = 5;
    STAT_TYPE_MAGICAL_ATTACK = 6;
    STAT_TYPE_EXP = 7;
}

enum UpdateState
{
    UPDATE_STATE_NONE = 0;
    UPDATE_STATE_ADDED = 1;
    UPDATE_STATE_MODIFIED = 2;
    UPDATE_STATE_REMOVED = 3;
}

enum GearType
{
    GEAR_TYPE_NONE = 0;
    GEAR_TYPE_HELMET = 1;
    GEAR_TYPE_CHEST = 2;
    GEAR_TYPE_LEGS = 3;
    GEAR_TYPE_ARMS = 4;
    GEAR_TYPE_BOOTS = 5;
    GEAR_TYPE_WEAPON = 6;
}

enum RespawnType {
    RESPAWN_TYPE_NONE = 0;
    RESPAWN_TYPE_TOWN = 1;                      // 마을로 귀환
    RESPAWN_TYPE_CHECKPOINT = 2;                // 체크포인트에서 부활
    RESPAWN_TYPE_RESURRECTION_ITEM = 3;         // 부활 아이템 사용
    RESPAWN_TYPE_IN_PLACE = 4;                  // 제자리 부활 (프리미엄)
    RESPAWN_TYPE_PARTY_MEMBER = 5;              // 파티원 위치로 부활
    RESPAWN_TYPE_GUILD_BASE = 6;                // 길드 거점으로 부활
    RESPAWN_TYPE_CASH_ITEM = 7;                 // 캐시 부활 아이템
    RESPAWN_TYPE_BATTLE_RESURRECTION = 8;       // 전투 중 부활 (힐러 스킬 등)
}

enum TeleportReason
{
    // 리스폰은 텔레포트에 포함하지 않는다.
    TELEPORT_REASON_NONE = 0;
    TELEPORT_REASON_TELEPORT_BY_ITEM = 1;       // 아이템 사용
    TELEPORT_REASON_ENTER_BY_QUEST = 2;         // 퀘스트 워프
    TELEPORT_REASON_RECALL_BY_PARTY = 3;        // 파티원 소환
};

enum EnterType
{
    // Enter: 플레이어의 주도적 입장을 의미
    ENTER_TYPE_NONE = 0;
    ENTER_TYPE_ENTER_GAME = 1;                  // 게임 입장
    ENTER_TYPE_SAME_MAP_PORTAL = 2;             // 포탈 사용(같은 맵)
    ENTER_TYPE_OTHER_MAP_PORTAL = 3;            // 포탈 사용(다른 맵)
    ENTER_TYPE_TELEPORT = 4;                    // 텔레포트(ex. 아이템 사용)
}
// Enter는 클라 주도, Respawn은 서버 주도?