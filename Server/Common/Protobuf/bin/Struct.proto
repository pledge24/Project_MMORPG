syntax = "proto3";
package Protocol;

import "Enum.proto";

message CharacterOverview
{
    uint64 character_id = 1;
    CharacterClass class = 2;
    string name = 3;
    uint32 level = 4;
}

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	PosInfo pos_info = 3;
   
    optional PlayerInfo player_info = 4;
}

message PlayerInfo
{
    // 캐릭터 기본 정보
    CharacterOverview overview = 1;

    // 성장 및 스텟 관련
    uint64 exp = 2;
    StatInfo stat_info = 3;

    // 소유 관련
    uint64 gold = 4;
    Inventory inventory = 5;
    repeated Slot equipped_gear = 6;
}

message PosInfo
{
	uint64 object_id = 1;
    int32 map_id = 2;
	float x = 3;
	float y = 4;
	float z = 5;
	float yaw = 6;
	MoveState state = 7;
}

message StatInfo
{
    int32 cur_hp = 1;
    int32 max_hp = 2;
    int32 cur_mp = 3;
    int32 max_mp = 4;
    int32 cur_attack = 5;
    int32 cur_magic = 6;
}

message Effect
{
    int32 effect_id = 1;
    float duration = 2;
}

message GearInfo
{
    int64 item_uid = 1;
    int32 enhance = 2;
    int32 durability = 3;
    int32 bonus_attack = 4;
    int32 bonus_magic = 5;
}

message Item
{
    int32 template_id = 1;
    ItemType type = 2;
    int32 count = 3;

    optional GearInfo GearInfo = 4;
}

message Slot
{
    int32 slot_id = 1;
    SlotType type = 2;
    optional Item item = 3;
}

message Inventory
{
    repeated Slot gear = 1;
    repeated Slot consumables = 2;
    repeated Slot miscellaneous = 3;
}

