syntax = "proto3";
package Protocol;

import "Enum.proto";

message CharacterOverview
{
    uint64 character_id = 1;
    CharacterClass class = 2;
    string name = 3;
    uint32 level = 4;
    //map<int32, int32> equipped_gear_summary = 5;
}

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	PosInfo pos_info = 3;
    uint32 room_id = 4;

    // ObjectType에 따른 정보
    oneof details
    {
        // oneof 그룹 내의 모든 필드는 기본적으로 optional 효과를 가짐
        PlayerInfo player_info = 5;
        MonsterInfo monster_info = 6;
    }
}

message PlayerInfo
{
    // 캐릭터 기본 정보(CharacterOverview 풀어서 들고있자)
    uint64 character_id = 1;
    CharacterClass class = 2;
    string name = 3;
    uint32 level = 4;

    // 성장 및 스텟 관련
    uint64 cur_exp = 5;
    uint64 max_exp = 6;
    StatInfo stat_info = 7;

    // 소유 관련
    optional Possession possession = 8;

    // 장착 장비 관련
    map<int32, Slot> equipped_gear_detail = 9;      // <SlotId(or GearType), Slot>
    map<int32, int32> equipped_gear_summary = 10;   // <SlotId(or GearType), template_id>
}

message Possession
{
    uint64 gold = 1;
    Inventory inventory = 2;
}

message MonsterInfo
{
    int32 template_id = 1;
    int32 hp = 2;
}

message Vector
{
    float x = 1;
    float y = 2;
    float z = 3;
}

message PosInfo
{
	uint64 object_id = 1;
	float x = 2;
	float y = 3;
	float z = 4;
    float yaw = 5;
	Vector move_direction = 6;
	MoveState state = 7;
}

message HitData
{
    uint64 attacker_id = 1;         // object_id
    uint64 target_id = 2;           // object_id

    DamageType damage_type = 3;     // 물리 피해? 마법 피해?
    uint64 damage = 4;
}

message StatInfo
{
    // 캐릭터 스텟 정보 전체를 보낼때 사용
    optional int32 max_hp = 1;
    optional int32 hp = 2;
    optional int32 max_mp = 3;
    optional int32 mp = 4;
    optional int32 physical_attack = 5;
    optional int32 magical_attack = 6;
}

message Stat
{
    // 게임내 상호작용에서 사용(지금은 StatInfo로 대체 사용)
    StatType type = 1;
    bool is_gauge = 2;
    int32 value = 3;
}

message Effect
{
    int32 effect_id = 1;
    float duration = 2;
}

message GearInfo
{
    int32 enhance_level = 1;
    int32 durability = 2;
    int32 additional_physical_attack = 3;  // 추가 물리 공격력
    int32 additional_magical_attack = 4;   // 추가 마법 공격력
}

message Item
{
    int32 template_id = 1;
    optional int64 item_uid = 2;
    optional int32 count = 3;

    // 아이템 인스턴스 데이터
    oneof instance_data{
        GearInfo gearInfo = 4;
    }
}

message Slot
{
    int32 slot_id = 1;              // 서버에선 딱 한 번만 세팅 1
    SlotType type = 2;              // 서버에선 딱 한 번만 세팅 2
    optional UpdateState state = 3; // 슬롯 갱신 상태: 서버가 세팅하고 클라이언트는 사용
    optional Item item = 4;
}

message Inventory
{
    repeated Slot gear = 1;
    repeated Slot consumables = 2;
    repeated Slot miscellaneous = 3;
}

message LevelUpInfo
{
    uint32 old_level = 1;
    uint32 new_level = 2;

//    uint32 earned_skill_points = 3;
//    uint32 earned_stat_points = 4;

    uint64 new_max_hp = 5;
    uint64 new_max_mp = 6;
    uint64 new_physical_attack = 7;
    uint64 new_magical_attack = 8;
}

message DiePenaltyInfo
{
    uint64 updated_exp = 1;
}