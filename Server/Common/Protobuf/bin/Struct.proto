syntax = "proto3";
package Protocol;

import "Enum.proto";

message CharacterOverview
{
    uint64 character_id = 1;
    CharacterClass class = 2;
    string name = 3;
    uint32 level = 4;
}

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	PosInfo pos_info = 3;
   
    // 특정 상황에만 있는 정보들
    optional PlayerInfo player_info = 4;
}

message PlayerInfo
{
    // 캐릭터 기본 정보(CharacterOverview 풀어서 들고있자)
    uint64 character_id = 1;
    CharacterClass class = 2;
    string name = 3;
    uint32 level = 4;

    // 성장 및 스텟 관련
    uint64 exp = 5;
    repeated StatInfo stat_info = 6;

    // 소유 관련
    uint64 gold = 7;
    Inventory inventory = 8;
    repeated Slot equipped_gear = 9;
}

message PosInfo
{
	uint64 object_id = 1;
    int32 map_id = 2;
	float x = 3;
	float y = 4;
	float z = 5;
	float yaw = 6;
	MoveState state = 7;
}

message StatInfo
{
    StatType type = 1;
    bool is_gauge = 2;
    int32 value = 3;
}

message Effect
{
    int32 effect_id = 1;
    float duration = 2;
}

message GearInfo
{
    int64 item_uid = 1;
    int32 enhance = 2;
    int32 durability = 3;
    int32 additional_physical_attack = 4;  // 추가 물리 공격력
    int32 additional_magical_attack = 5;   // 추가 마법 공격력
}

message Item
{
    int32 template_id = 1;
    ItemType type = 2;
    int32 count = 3;

    optional GearInfo GearInfo = 4;
}

message Slot
{
    int32 slot_id = 1;
    SlotType type = 2;
    optional Item item = 3;
}

message Inventory
{
    repeated Slot gear = 1;
    repeated Slot consumables = 2;
    repeated Slot miscellaneous = 3;
}



