syntax = "proto3";
package Protocol;

import "Enum.proto";

message CharacterOverview
{
    uint64 character_id = 1;
    CharacterClass class = 2;
    string name = 3;
    uint32 level = 4;
}

message ObjectInfo
{
	uint64 object_id = 1;
	ObjectType object_type = 2;
	PosInfo pos_info = 3;
    StatInfo stat_info = 4;
    optional PlayerInfo player_info = 5;
}

message PlayerInfo
{
    CharacterOverview overview = 1;
    uint64 gold = 2;
    uint64 exp = 3;
    repeated Item items = 4;
    repeated Equipment Equipments = 5;
}

message PosInfo
{
	uint64 object_id = 1;
    int32 map_id = 2;
	float x = 3;
	float y = 4;
	float z = 5;
	float yaw = 6;
	MoveState state = 7;
}

message StatInfo
{
    int32 cur_hp = 1;
    int32 max_hp = 2;
    int32 cur_mp = 3;
    int32 max_mp = 4;
    int32 cur_attack = 5;
    int32 cur_magic = 6;
}

message Item
{
    int32 template_id = 1;
    int32 slot_id = 2;
    int32 count = 3;
}

message Equipment
{
    int32 item_uid = 1;
    int32 template_id = 2;
    int32 slot_id = 3;
    int32 count = 4;
}

message Effect
{
    int32 effect_id = 1;
    float duration = 2;
}