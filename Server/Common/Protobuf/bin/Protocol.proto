syntax = "proto3";
package Protocol;

import "Enum.proto";
import "Struct.proto";

message C_PING
{

}

message S_PONG
{

}

message C_LOGIN
{
    string accessToken = 1;
}

message S_LOGIN
{
	bool success = 1;
	repeated CharacterOverview characters = 2; // 캐릭터 아이디 발급 전
}

message C_CREATE_CHARACTER
{
    CharacterOverview character = 1;
}

message S_CREATE_CHARACTER
{
    bool success = 1;
    string cause = 2;
    uint64 characterId = 3;
}

message C_DELETE_CHARACTER
{
    uint64 characterId = 1;
}

message S_DELETE_CHARACTER
{
    bool success = 1;
    uint64 characterId = 2;
}

message C_ENTER_GAME
{
	uint64 characterId = 1;
}

message S_ENTER_GAME
{
	bool success = 1;
	ObjectInfo player = 2;
}

message C_LEAVE_GAME
{

}

message S_LEAVE_GAME
{

}

message S_SPAWN
{
	repeated ObjectInfo players = 1;
}

message S_DESPAWN
{
	repeated uint64 object_ids = 1;
}

message C_MOVE
{
	PosInfo info = 1;
}

message S_MOVE
{
	PosInfo info = 1;
}

message C_CHAT
{
	string msg = 1;
}

message S_CHAT
{
	uint64 playerId = 1;
	string msg = 2;
}